function viewVendas(){
  const mesKey = isoHoje().slice(0,7);
  const doMes = db.vendas.filter(v => (v.data||'').slice(0,7)===mesKey);
  const totalMes = doMes.reduce((s,v)=>s+vendaTotal(v),0);
  const lista = [...db.vendas].sort((a,b)=>(b.data||'').localeCompare(a.data||'') || (b.num||0)-(a.num||0));
  let grupos = '', mesAtual = '';
  lista.forEach(v => {
    const k = (v.data||'').slice(0,7);
    if(k !== mesAtual){
      mesAtual = k;
      const d = new Date(k+'-02');
      grupos += `<div class="grp-h">${d.toLocaleDateString('pt-BR',{month:'long'})} de ${d.getFullYear()}</div>`;
    }
    grupos += `<div class="row" data-id="${v.id}"><div class="row-ico">${ic('tag',19)}</div>
      <div class="row-main"><b>#${String(v.num).padStart(4,'0')} · ${esc(v.cliente||'Consumidor')}</b>
      <span>${v.itens.length} ${v.itens.length>1?'itens':'item'} · ${fmtData(v.data)}</span></div>
      <div class="row-side"><b>${fmtMoeda(vendaTotal(v))}</b><span>${esc(v.pagamento||'')}</span></div></div>`;
  });
  $('#view').innerHTML = `
    <div class="tira">
      <div class="stat"><b>${fmtMoeda(totalMes)}</b><span>Faturado no mês</span></div>
      <div class="stat"><b>${doMes.length}</b><span>Vendas</span></div>
      <div class="stat"><b>${db.vendas.length}</b><span>Total</span></div>
    </div>
    ${lista.length ? grupos : `<div class="empty">${ic('tag',32)}<b>Nenhuma venda ainda</b><p>Monte a primeira venda e emita o recibo em PDF.</p></div>`}`;
  $$('#view .row').forEach(r => r.onclick = () => sheetRecibo(r.dataset.id));
}

function pickerCoelho(cb){
  const p = openSheet('Coelho do plantel', `
    <div class="search">${ic('search',18)}<input id="pkQ" type="search" placeholder="Buscar brinco ou raça"></div>
    <div id="pkLista"></div>`);
  const render = () => {
    const q = p.querySelector('#pkQ').value.toLowerCase();
    const lista = ativos().filter(c => ((c.brinco||'')+' '+(c.raca||'')).toLowerCase().includes(q));
    p.querySelector('#pkLista').innerHTML = lista.length ? lista.map(c =>
      `<button class="pk-row" data-id="${c.id}" ${(!temAcesso() && ehRacaPremium(c.raca))?'data-vip="1"':''}>
        ${avaHTML(c,'ava')}
        <div class="row-main"><b>${esc(c.brinco)}${c.nome?' · '+esc(c.nome):''}</b>
          <span>${esc(c.raca||'—')} · ${c.peso?fmtKg(c.peso):'sem peso'} · ${STATUS_L[c.status]}</span></div>
        <span style="color:var(--carrot);flex:none">${ic('plus',18)}</span>
      </button>`).join('') : `<div class="empty">${bunnySVG('')}<b>Nada encontrado</b><p>Nenhum coelho ativo com essa busca.</p></div>`;
    p.querySelectorAll('.pk-row').forEach(b => b.onclick = () => {
      const c = porId(b.dataset.id); p.close(); if(c) cb(c);
    });
  };
  p.querySelector('#pkQ').oninput = render;
  render();
}

function sheetVenda(pre){
  const sh = openSheet('Nova venda', `
    <div class="form">
      <div class="frow">
        <div class="fld"><label>Cliente</label><input id="vCli" list="dlCli" placeholder="Nome do comprador">
          <datalist id="dlCli">${[...new Set(db.vendas.map(v=>v.cliente).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
        <div class="fld"><label>Data</label><input id="vData" type="date" value="${isoHoje()}"></div>
      </div>
      <div class="fld"><label>Itens</label>
        <div class="it-tools">
          <button id="vAddCoelho">${ic('rabbit',16)}<span>Coelho do plantel</span></button>
          <button id="vAddLivre" class="sec">${ic('plus',16)}<span>Item livre</span></button>
        </div>
        <div id="vItens"></div>
      </div>
      <div class="frow">
        <div class="fld"><label>Desconto (R$)</label><input id="vDesc" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00"></div>
        <div class="fld"><label>Pagamento</label><div class="seg" id="vPag">
          <button data-v="Dinheiro" class="on">Dinh.</button><button data-v="Pix">Pix</button>
          <button data-v="Cartão">Cartão</button><button data-v="A prazo">Prazo</button></div></div>
      </div>
      <div class="fld"><label>Observações</label><textarea id="vObs" placeholder="Condições, entrega…"></textarea></div>
    </div>`,
    { foot:`<div class="vtot"><span>Total da venda</span><b id="vTot">R$ 0,00</b></div>
            <button class="btn primary" id="vSal" style="flex:none">${ic('check',18)}<span class="serif">Emitir</span></button>` });

  const recalc = () => {
    let sub = 0;
    sh.querySelectorAll('.it-row').forEach(r => {
      sub += (parseFloat(r.querySelector('.i-qtd').value)||0) * (parseFloat(r.querySelector('.i-preco').value)||0);
    });
    const desc = parseFloat(sh.querySelector('#vDesc').value)||0;
    sh.querySelector('#vTot').textContent = fmtMoeda(Math.max(0, sub - desc));
  };

  const addItem = it => {
    const row = document.createElement('div'); row.className = 'it-row';
    row.innerHTML = `<input class="i-desc" placeholder="Descrição" value="${esc(it.desc||'')}" data-cid="${it.coelhoId||''}">
      <input class="i-qtd" type="number" inputmode="decimal" min="0" step="any" value="${it.qtd ?? 1}">
      <select class="i-un"><option${(it.un||'un')==='un'?' selected':''}>un</option><option${it.un==='kg'?' selected':''}>kg</option><option${it.un==='cx'?' selected':''}>cx</option></select>
      <input class="i-preco" type="number" inputmode="decimal" min="0" step="any" placeholder="0,00" value="${it.preco ?? ''}">
      <button class="i-x" aria-label="Remover item">${ic('x',15)}</button>`;
    row.querySelector('.i-x').onclick = () => { row.remove(); recalc(); };
    row.querySelectorAll('input').forEach(i => i.addEventListener('input', recalc));
    sh.querySelector('#vItens').appendChild(row); recalc();
  };
  if(pre) addItem(pre); else addItem({desc:'',qtd:1,un:'un',preco:''});
  sh.querySelector('#vAddLivre').onclick = () => addItem({desc:'',qtd:1,un:'un',preco:''});
  sh.querySelector('#vAddCoelho').onclick = () => pickerCoelho(c => {
    addItem({ coelhoId:c.id, desc:c.brinco + (c.raca? ' — '+c.raca : ''), qtd:1, un:'un', preco:'' });
    toast(c.brinco + ' adicionado à venda');
  });
  sh.querySelector('#vDesc').addEventListener('input', recalc);
  sh.querySelector('#vPag').querySelectorAll('button').forEach(b => b.onclick = () => {
    sh.querySelectorAll('#vPag button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  });
  sh.querySelector('#vSal').onclick = () => {
    const itens = [];
    sh.querySelectorAll('.it-row').forEach(r => {
      const desc = r.querySelector('.i-desc').value.trim();
      const qtd = parseFloat(r.querySelector('.i-qtd').value)||0;
      const preco = parseFloat(r.querySelector('.i-preco').value)||0;
      if(desc && qtd>0) itens.push({ desc, qtd, un:r.querySelector('.i-un').value, preco, coelhoId:r.querySelector('.i-desc').dataset.cid || null });
    });
    if(!itens.length) return toast('Adicione pelo menos um item','x',true);
    itens.forEach(i => {
      const c = i.coelhoId ? porId(i.coelhoId) : null;
      if(c){
        const san = db.sanidade.filter(s =>
          s.alvoTipo==='individual' ? s.coelhoId===c.id :
          (s.grupo==='ativos' || s.grupo===c.status));
        i.animal = { brinco:c.brinco, raca:c.raca||'', sexo:c.sexo, nascimento:c.nascimento||null,
          idadeTxt:idade(c.nascimento), peso:c.peso||null, jaula:c.jaula||'',
          sanidade: san.map(s=>({med:s.med, data:s.data, carenciaDias:Number(s.carenciaDias)||0})) };
        c.status = 'vendido';
      }
    });
    const pag = sh.querySelector('#vPag .on').dataset.v;
    const v = { id:uid(), num:proxNum(), data:sh.querySelector('#vData').value || isoHoje(),
      cliente:sh.querySelector('#vCli').value.trim() || 'Consumidor',
      itens, desconto:parseFloat(sh.querySelector('#vDesc').value)||0, pagamento:pag,
      obs:sh.querySelector('#vObs').value.trim(), criadoEm:new Date().toISOString() };
    db.vendas.push(v); save(); sh.close(); hopBunny();
    toast('Venda #'+String(v.num).padStart(4,'0')+' emitida'); render(); sheetRecibo(v.id);
  };
}

function reciboHTML(v){
  const S = db.settings;
  const sub = v.itens.reduce((s,i)=>s+i.qtd*i.preco,0);
  const contato = [S.cidade, S.telefone].filter(Boolean).join('  ·  ') || 'Gestão de cunicultura';
  const fichas = v.itens.filter(i=>i.animal);
  const fichaBloco = i => {
    const a = i.animal;
    const apps = a.sanidade||[];
    return `<div class="ficha">
      <div class="ficha-h"><b>Brinco ${esc(a.brinco)}</b><span>vendido em ${fmtData(v.data)}</span></div>
      <div class="ficha-l">Raça: <b>${esc(a.raca||'—')}</b> · ${a.sexo==='M'?'Macho':'Fêmea'} · ${esc(a.idadeTxt||'—')}</div>
      <div class="ficha-l">Peso: <b>${a.peso?fmtKg(a.peso):'—'}</b> · Nascimento: ${fmtData(a.nascimento)}${a.jaula?' · Jaula '+esc(a.jaula):''}</div>
      ${apps.length ? apps.map(s=>`<div class="ficha-l">• ${esc(s.med)} — ${fmtData(s.data)}${s.carenciaDias?` · carência até ${fmtData(addDias(s.data,s.carenciaDias))}`:''}</div>`).join('')
        : '<div class="ficha-l" style="color:var(--muted)">• Sem registros de medicação ou vacinação.</div>'}
    </div>`;
  };
  return `<div class="recibo">
    <div class="r-head"><div class="r-logo">${bunnySVG('')}</div>
      <div class="r-name">${esc(S.nome||'Criatório')}</div><div class="r-sub">${esc(contato)}</div></div>
    <div class="r-title serif">RECIBO DE VENDA<small>documento não fiscal — controle interno</small></div>
    <div class="r-info">
      <div class="col"><span>Cliente</span><b>${esc(v.cliente||'Consumidor')}</b></div>
      <div class="col right"><span>Nº / Data</span><b>#${String(v.num).padStart(4,'0')} · ${fmtData(v.data)}</b></div>
    </div>
    <table class="r-items"><thead><tr><th>Descrição</th><th class="num">Qtd</th><th class="num">Unit.</th><th class="num">Valor</th></tr></thead>
    <tbody>${v.itens.map(i => `<tr><td>${esc(i.desc)}${i.animal?`<div class="r-subline">${esc([i.animal.raca, i.animal.sexo==='M'?'Macho':'Fêmea', i.animal.idadeTxt].filter(Boolean).join(' · '))}</div>`:''}</td>
      <td class="num">${fmtNum(i.qtd)} ${esc(i.un||'un')}</td>
      <td class="num">${fmtNum(i.preco)}</td><td class="num"><b>${fmtNum(i.qtd*i.preco)}</b></td></tr>`).join('')}</tbody></table>
    <div class="r-tots">
      <div class="tr"><span>Subtotal</span><span>${fmtMoeda(sub)}</span></div>
      ${v.desconto ? `<div class="tr"><span>Desconto</span><span>− ${fmtMoeda(v.desconto)}</span></div>` : ''}
      <div class="tr grand"><span>TOTAL</span><span>${fmtMoeda(vendaTotal(v))}</span></div>
      <div class="tr" style="margin-top:5px"><span>Pagamento</span><span>${esc(v.pagamento||'—')}</span></div>
    </div>
    ${fichas.length ? `<div class="sec-t" style="margin-top:14px">Ficha sanitária dos animais vendidos</div>${fichas.map(fichaBloco).join('')}` : ''}
    ${v.obs?`<div class="r-obs">Obs.: ${esc(v.obs)}</div>`:''}
    <div class="r-sign"><i></i>Assinatura — ${esc(S.responsavel || S.nome || 'responsável')}</div>
    <div class="r-foot">Emitido em ${fmtDataHora(new Date())} · Lepus — gestão de cunicultura</div>
  </div>`;
}

function sheetRecibo(id){
  const v = db.vendas.find(x=>x.id===id); if(!v) return;
  const sh = openSheet('Recibo #'+String(v.num).padStart(4,'0'), reciboHTML(v), {
    foot:`<button class="btn ghost" id="rShare" ${temAcesso()?'':'data-vip="1"'}>${ic('share',18)} Enviar</button>
          <button class="btn primary" id="rPdf" ${temAcesso()?'':'data-vip="1"'}>${ic('download',18)} PDF</button>` });
  const nomeArq = 'Recibo-' + String(v.num).padStart(4,'0') + '.pdf';
  sh.querySelector('#rPdf').onclick = () => { const blob = buildVendaPdf(v); downloadBlob(blob, nomeArq); toast('PDF gerado'); };
  sh.querySelector('#rShare').onclick = () => { const blob = buildVendaPdf(v); sharePdf(blob, nomeArq); };
  sh.querySelector('.sh-body').insertAdjacentHTML('beforeend',
    `<button class="link" id="rDel" style="display:block;margin:0 auto 6px;background:none;border:none">${ic('trash',14)} Excluir esta venda</button>`);
  sh.querySelector('#rDel').onclick = () => confirmSheet('Excluir venda',
    'O recibo será apagado definitivamente. Os animais vendidos permanecem com status “Vendido” e não voltam ao plantel.',
    'Excluir',()=>{
      db.vendas = db.vendas.filter(x=>x.id!==id);
      save(); sh.close(); toast('Venda excluída'); render();
    });
}

/* ============================================================
   GERADOR DE PDF — escrita direta da especificação, sem libs
   ============================================================ */
const HELV = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function pdfEsc(s){
  s = String(s ?? '');
  const mapa = {'\u20AC':128,'\u2013':150,'\u2014':151,'\u2018':145,'\u2019':146,'\u201C':147,'\u201D':148,'\u2022':149,'\u2026':133,'\u0152':140,'\u0153':156,'\u0160':138,'\u0161':154,'\u017D':142,'\u017E':158};
  let out = '';
  for(const ch of s){
    let c = ch.codePointAt(0);
    if(mapa[ch] !== undefined) c = mapa[ch];
    else if(c > 255) c = 63;
    out += String.fromCharCode(c);
  }
  return out;
}
const pdfTxt = s => pdfEsc(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function tw(s, f, size){
  const t = pdfEsc(s); let w = 0;
  for(let i=0;i<t.length;i++){ const c = t.charCodeAt(i); w += (c>=32 && c<=126) ? HELV[c-32] : 556; }
  if(f===2) w *= 1.055;
  return w * size / 1000;
}
const r2 = v => Math.round(v*100)/100;
const PC = { green:'0.118 0.227 0.149', white:'1 1 1', ink:'0.133 0.188 0.118', muted:'0.43 0.47 0.40',
  cream:'0.949 0.925 0.863', linec:'0.85 0.82 0.74', carrot:'0.851 0.431 0.188' };
function T(x, y, s, f, size, col, align){
  let xx = x; const w = tw(s, f, size);
  if(align === 'c') xx = x - w/2;
  if(align === 'r') xx = x - w;
  return `q ${col} rg BT /F${f} ${size} Tf 1 0 0 1 ${r2(xx)} ${r2(y)} Tm (${pdfTxt(s)}) Tj ET Q\n`;
}
function R(x, y, w, h, col){ return `q ${col} rg ${r2(x)} ${r2(y)} ${r2(w)} ${r2(h)} re f Q\n`; }
function St(x, y, w, h, col){ return `q ${col} RG 0.9 w ${r2(x)} ${r2(y)} ${r2(w)} ${r2(h)} re S Q\n`; }
function L(x1, y1, x2, y2, col, wd){ return `q ${col} RG ${wd} w ${r2(x1)} ${r2(y1)} m ${r2(x2)} ${r2(y2)} l S Q\n`; }
function truncPdf(s, maxW, f, size){
  s = String(s ?? '');
  if(tw(s,f,size) <= maxW) return s;
  let t = s;
  while(tw(t,f,size) > maxW && t.length > 2) t = t.slice(0,-2);
  return t.trim() + '\u2026';
}
function ellPDF(cx, cy, rx, ry, ang, col){
  const co = Math.cos(ang), si = Math.sin(ang);
  return `q ${col} rg ${r2(rx*co)} ${r2(rx*si)} ${r2(-ry*si)} ${r2(ry*co)} ${r2(cx)} ${r2(cy)} cm ` +
    `1 0 m 1 0.5523 0.5523 1 0 1 c -0.5523 1 -1 0.5523 -1 0 c -1 -0.5523 -0.5523 -1 0 -1 c 0.5523 -1 1 -0.5523 1 0 c h f Q\n`;
}
function logoPDF(cx, cy, r){
  const s = r/28;
  let c = '';
  c += ellPDF(cx, cy, r, r, 0, PC.cream);
  c += ellPDF(cx-8*s,  cy+14*s, 5.2*s, 12*s, -0.22, PC.green);
  c += ellPDF(cx+8*s,  cy+14*s, 5.2*s, 12*s,  0.22, PC.green);
  c += ellPDF(cx, cy-4*s, 13.5*s, 12*s, 0, PC.green);
  c += ellPDF(cx-5*s,  cy-2*s, 1.5*s, 1.9*s, 0, PC.cream);
  c += ellPDF(cx+5*s,  cy-2*s, 1.5*s, 1.9*s, 0, PC.cream);
  c += `q ${PC.carrot} rg ${r2(cx-2.3*s)} ${r2(cy-8*s)} m ${r2(cx+2.3*s)} ${r2(cy-8*s)} l ${r2(cx)} ${r2(cy-10.6*s)} l h f Q\n`;
  return c;
}
const linhaAnimal = a => [a.raca, a.sexo==='M'?'Macho':'Fêmea', a.idadeTxt, a.peso ? fmtKg(a.peso) : null].filter(Boolean).join('  ·  ');

function buildVendaPdf(v){
  const S = db.settings, W = 595.28, H = 841.89, M = 52, XM = W - M;
  const sub = v.itens.reduce((s,i)=>s+i.qtd*i.preco,0);
  const desc = Number(v.desconto)||0, tot = Math.max(0, sub - desc);
  const brl = n => n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  const contato = [S.cidade, S.telefone].filter(Boolean).join('   ·   ') || 'Gestão de cunicultura';
  const fichas = v.itens.filter(i=>i.animal);
  const numTxt = '#' + String(v.num).padStart(4,'0');
  const colH = '0.30 0.34 0.28';

  const pages = [];
  let cur = '', y = 0;

  const startPage = cont => {
    cur = R(0, H-118, W, 118, PC.green)
        + logoPDF(M+38, H-59, 28)
        + T(M+84, H-50, truncPdf(S.nome||'Criatório', 360, 2, 20), 2, 20, PC.white)
        + T(M+84, H-71, truncPdf(contato, 400, 1, 9), 1, 9, PC.white);
    y = H - 152;
    cur += T(W/2, y, 'RECIBO DE VENDA' + (cont ? ' (continuação)' : ''), 2, 15.5, PC.ink, 'c');
    if(!cont) cur += T(W/2, y-15, 'documento não fiscal — controle interno', 1, 8.5, PC.muted, 'c');
    y -= cont ? 34 : 44;
  };
  const endPage = () => { pages.push(cur); cur = ''; };
  const need = h => { if(y - h < 66){ endPage(); startPage(true); return true; } return false; };
  const tabHead = () => {
    cur += R(M, y-20, XM-M, 20, PC.cream)
         + T(M+8, y-14, 'DESCRIÇÃO', 2, 7.5, colH)
         + T(336, y-14, 'QTD', 2, 7.5, colH, 'r')
         + T(444, y-14, 'UNIT. (R$)', 2, 7.5, colH, 'r')
         + T(XM-8, y-14, 'VALOR (R$)', 2, 7.5, colH, 'r');
    y -= 30;
  };

  startPage(false);

  const bh = 76, bw = XM - M;
  cur += R(M, y-bh, bw, bh, PC.cream)
       + T(M+14, y-18, 'CLIENTE', 1, 7, PC.muted)
       + T(M+14, y-35, truncPdf(v.cliente||'Consumidor', bw-330, 2, 12.5), 2, 12.5, PC.ink)
       + T(M+14, y-55, 'PAGAMENTO', 1, 7, PC.muted)
       + T(M+14, y-70, truncPdf(v.pagamento||'—', 240, 2, 10.5), 2, 10.5, PC.ink)
       + T(M+330, y-18, 'NÚMERO', 1, 7, PC.muted)
       + T(M+330, y-35, numTxt, 2, 14, PC.carrot)
       + T(M+330, y-55, 'DATA', 1, 7, PC.muted)
       + T(M+330, y-70, fmtData(v.data), 2, 10.5, PC.ink);
  y -= bh + 20;
  tabHead();

  v.itens.forEach(i => {
    const a = i.animal, two = !!a;
    need(two ? 48 : 36);
    cur += T(M+8, y, truncPdf(i.desc, 250, 2, 10), 2, 10, PC.ink);
    if(a) cur += T(M+8, y-13, truncPdf(linhaAnimal(a), 250, 1, 7.5), 1, 7.5, PC.muted);
    cur += T(336, y, fmtNum(i.qtd)+' '+(i.un||'un'), 1, 9.5, PC.ink, 'r')
         + T(444, y, brl(i.preco), 1, 9.5, PC.ink, 'r')
         + T(XM-8, y, brl(i.qtd*i.preco), 2, 10, PC.ink, 'r')
         + L(M, y-(two?22:16), XM, y-(two?22:16), PC.linec, 0.4);
    y -= two ? 36 : 26;
  });

  need(130);
  let yF = y - 8;
  cur += T(444, yF, 'Subtotal', 1, 9.5, PC.muted, 'r') + T(XM-8, yF, brl(sub), 1, 10, PC.ink, 'r');
  yF -= 17;
  if(desc){ cur += T(444, yF, 'Desconto', 1, 9.5, PC.muted, 'r') + T(XM-8, yF, '-'+brl(desc), 1, 10, PC.ink, 'r'); yF -= 17; }
  cur += R(XM-226, yF-26, 226, 33, PC.green)
       + T(XM-212, yF-16, 'TOTAL', 2, 10.5, PC.white)
       + T(XM-14, yF-15, 'R$ ' + brl(tot), 2, 13.5, PC.white, 'r');
  y = yF - 52;
  if(v.obs){ need(40); cur += T(M, y, truncPdf('Obs.: '+v.obs, 480, 1, 8.5), 1, 8.5, PC.muted); y -= 26; }

  if(fichas.length){
    need(80);
    y -= 12;
    cur += T(M, y, 'FICHA SANITÁRIA — ANIMAIS VENDIDOS', 2, 10.5, PC.green)
         + L(M, y-6, XM, y-6, PC.green, 0.8);
    y -= 24;
    fichas.forEach(i => {
      const a = i.animal, apps = a.sanidade || [];
      const bh2 = 81 + apps.length*13;
      need(bh2 + 14);
      cur += St(M, y-bh2, XM-M, bh2, PC.linec)
           + R(M, y-22, XM-M, 22, PC.cream)
           + T(M+12, y-15, 'BRINCO  ' + a.brinco, 2, 10.5, PC.ink)
           + T(XM-12, y-15, 'vendido em ' + fmtData(v.data), 1, 7.5, PC.muted, 'r');
      let yy = y - 38;
      cur += T(M+12, yy, truncPdf('Raça: ' + (a.raca||'—') + '   ·   ' + (a.sexo==='M'?'Macho':'Fêmea') + '   ·   ' + (a.idadeTxt||'—'), 460, 1, 8.5), 1, 8.5, PC.ink);
      yy -= 13;
      cur += T(M+12, yy, 'Peso: ' + (a.peso ? fmtKg(a.peso) : '—') + '   ·   Nascimento: ' + fmtData(a.nascimento), 1, 8.5, PC.ink);
      yy -= 18;
      if(apps.length){
        cur += T(M+12, yy, 'APLICAÇÕES E VACINAS REGISTRADAS', 1, 6.8, PC.muted);
        yy -= 13;
        apps.forEach(s => {
          const txt = '\u2022  ' + s.med + '  —  ' + fmtData(s.data) +
            (s.carenciaDias ? '  ·  carência até ' + fmtData(addDias(s.data, s.carenciaDias)) : '  ·  sem carência');
          cur += T(M+12, yy, truncPdf(txt, 460, 1, 8.5), 1, 8.5, PC.ink);
          yy -= 13;
        });
      } else {
        cur += T(M+12, yy, 'Sem registros de medicação ou vacinação no período.', 1, 8.5, PC.muted);
      }
      y -= bh2 + 14;
    });
  }

  need(100);
  y -= 6;
  cur += T(W/2, y, 'Obrigado pela preferência!', 2, 11, PC.ink, 'c')
       + L(W/2-105, y-42, W/2+105, y-42, '0.35 0.39 0.33', 0.7)
       + T(W/2, y-55, truncPdf('Assinatura — ' + (S.responsavel || S.nome || 'responsável'), 300, 1, 8), 1, 8, PC.muted, 'c');
  endPage();

  const total = pages.length;
  const fin = pages.map((c, idx) => c
    + R(0, 0, W, 30, PC.cream)
    + T(W/2, 11.5, 'Emitido em ' + fmtDataHora(new Date()) + '  ·  Lepus' + (total>1 ? '  ·  página '+(idx+1)+' de '+total : ''), 1, 7.5, PC.muted, 'c'));

  const nObjs = 4 + fin.length*2;
  const body = new Array(nObjs+1);
  body[1] = '<</Type/Catalog/Pages 2 0 R>>';
  body[2] = `<</Type/Pages/Kids[${fin.map((_,i)=>(5+i*2)+' 0 R').join(' ')}]/Count ${fin.length}>>`;
  body[3] = '<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>';
  body[4] = '<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>';
  fin.forEach((content, i) => {
    const pid = 5+i*2, cid = pid+1;
    body[pid] = `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${cid} 0 R>>`;
    body[cid] = `<</Length ${content.length}>>\nstream\n${content}endstream`;
  });
  let out = '%PDF-1.4\n';
  const offs = [];
  for(let id=1; id<=nObjs; id++){ offs[id] = out.length; out += `${id} 0 obj\n${body[id]}\nendobj\n`; }
  const xref = out.length;
  out += `xref\n0 ${nObjs+1}\n0000000000 65535 f \n`;
  for(let id=1; id<=nObjs; id++) out += String(offs[id]).padStart(10,'0') + ' 00000 n \n';
  out += `trailer\n<</Size ${nObjs+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([new Uint8Array([...out].map(ch => ch.charCodeAt(0)))], {type:'application/pdf'});
}

function downloadBlob(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function sharePdf(blob, nome){
  try{
    const file = new File([blob], nome, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:nome });
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  downloadBlob(blob, nome);
}

   ============================================================ */
function makeIcon(S, maskable){
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#1E3A26'; x.fillRect(0,0,S,S);
  const k = maskable ? 0.68 : 0.92;
  x.save();
  x.translate(S/2, S/2); x.scale(k, k); x.translate(-256, -285);
  x.fillStyle = '#F4EFE4';
  const ear = (cx, rot) => { x.save(); x.translate(cx, 205); x.rotate(rot);
    x.beginPath(); x.ellipse(0,0,54,112,0,0,7); x.fill(); x.restore(); };
  ear(210, -0.24); ear(302, 0.24);
  x.beginPath(); x.ellipse(256, 356, 130, 120, 0, 0, 7); x.fill();
  x.fillStyle = '#1E3A26';
  [[210,338],[302,338]].forEach(([ex,ey]) => { x.beginPath(); x.ellipse(ex, ey, 11, 14, 0, 0, 7); x.fill(); });
  x.fillStyle = '#D96E30';
  x.beginPath(); x.moveTo(256, 392); x.lineTo(243, 374); x.lineTo(269, 374); x.closePath(); x.fill();
  x.restore();
  return c.toDataURL('image/png');
}
function setupPWA(){
  if(location.protocol === 'file:'){
    try{
      document.querySelectorAll('link[rel=manifest]').forEach(l => l.remove());
      const t = document.createElement('link');
      t.rel = 'apple-touch-icon'; t.href = makeIcon(180);
      document.head.appendChild(t);
      const man = { name:'Lepus — Cunicultura', short_name:'Lepus',
        description:'Criação, manejo, abates e vendas para cunicultores. Funciona offline.',
        start_url:'.', display:'standalone', background_color:'#F4EFE4', theme_color:'#1E3A26',
        icons:[ {src:makeIcon(192), sizes:'192x192', type:'image/png', purpose:'any'},
                {src:makeIcon(512), sizes:'512x512', type:'image/png', purpose:'any'},
                {src:makeIcon(512, true), sizes:'512x512', type:'image/png', purpose:'maskable'} ] };
      const l = document.createElement('link');
      l.rel = 'manifest';
      l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
      document.head.appendChild(l);
    }catch(e){}
  }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); window._installEvt = e; renderHeader();
  });
  window.addEventListener('appinstalled', () => {
    window._installEvt = null; toast('Lepus instalado no aparelho'); renderHeader();
  });
}
function tentarInstalar(){
  if(window._installEvt){
    window._installEvt.prompt();
    window._installEvt.userChoice.finally(() => { window._installEvt = null; renderHeader(); });
  } else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    toast('No iPhone: Compartilhar → Adicionar à Tela de Início','share');
  } else {
    toast('Use o menu do navegador → Instalar app','install');
  }
}

  const k = maskable ? 0.68 : 0.92;
  x.save();
  x.translate(S/2, S/2); x.scale(k, k); x.translate(-256, -285);
  x.fillStyle = '#F4EFE4';
  const ear = (cx, rot) => { x.save(); x.translate(cx, 205); x.rotate(rot);
    x.beginPath(); x.ellipse(0,0,54,112,0,0,7); x.fill(); x.restore(); };
  ear(210, -0.24); ear(302, 0.24);
  x.beginPath(); x.ellipse(256, 356, 130, 120, 0, 0, 7); x.fill();
  x.fillStyle = '#1E3A26';
  [[210,338],[302,338]].forEach(([ex,ey]) => { x.beginPath(); x.ellipse(ex, ey, 11, 14, 0, 0, 7); x.fill(); });
  x.fillStyle = '#D96E30';
  x.beginPath(); x.moveTo(256, 392); x.lineTo(243, 374); x.lineTo(269, 374); x.closePath(); x.fill();
  x.restore();
  return c.toDataURL('image/png');
}
function setupPWA(){
  if(location.protocol === 'file:'){
    try{
      document.querySelectorAll('link[rel=manifest]').forEach(l => l.remove());
      const t = document.createElement('link');
      t.rel = 'apple-touch-icon'; t.href = makeIcon(180);
      document.head.appendChild(t);
      const man = { name:'Lepus — Cunicultura', short_name:'Lepus',
        description:'Criação, manejo, abates e vendas para cunicultores. Funciona offline.',
        start_url:'.', display:'standalone', background_color:'#F4EFE4', theme_color:'#1E3A26',
        icons:[ {src:makeIcon(192), sizes:'192x192', type:'image/png', purpose:'any'},
                {src:makeIcon(512), sizes:'512x512', type:'image/png', purpose:'any'},
                {src:makeIcon(512, true), sizes:'512x512', type:'image/png', purpose:'maskable'} ] };
      const l = document.createElement('link');
      l.rel = 'manifest';
      l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
      document.head.appendChild(l);
    }catch(e){}
  }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); window._installEvt = e; renderHeader();
  });
  window.addEventListener('appinstalled', () => {
    window._installEvt = null; toast('Lepus instalado no aparelho'); renderHeader();
  });
}
function tentarInstalar(){
  if(window._installEvt){
    window._installEvt.prompt();
    window._installEvt.userChoice.finally(() => { window._installEvt = null; renderHeader(); });
  } else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    toast('No iPhone: Compartilhar → Adicionar à Tela de Início','share');
  } else {
    toast('Use o menu do navegador → Instalar app','install');
  }
}

/* ---------- Início ---------- */
setupPWA();
migraTarefasDeBackup();
render();
verificarAtrasadas();
lnAgendarTodas();
if(!db.settings.configurado) sheetBoasVindas();
